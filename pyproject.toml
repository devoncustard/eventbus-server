[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eventbus"
version = "0.1.0"
description = "A simple, typed event bus with pattern matching, priorities, and sync/async handler support."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]
mysql = ["asyncmy"]

[tool.ruff]
target-version = "py313"

[tool.pytest.ini_options]
asyncio_mode = "auto"
